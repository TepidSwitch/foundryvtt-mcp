name: Fork CI

# The upstream workflows only run on `main`; this fork works on
# `stas/local-enhancements` and `feat/*` branches. Kept in its own file so
# upstream merges never conflict with it.

on:
  push:
    branches: [ 'stas/**', 'feat/**' ]
  pull_request:
    branches: [ 'stas/**' ]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.repository == 'TepidSwitch/foundryvtt-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Type check
      run: bunx tsc --noEmit

    - name: Build
      run: bun run build

    - name: Unit tests
      run: bun run test
      env:
        NODE_ENV: test
        FOUNDRY_URL: http://localhost:30000
        LOG_LEVEL: error

    - name: Startup smoke test
      run: bun run smoke

    - name: Dotenv load-order smoke test
      run: bun run smoke:dotenv

    - name: Pack smoke test
      run: bun run smoke:pack
